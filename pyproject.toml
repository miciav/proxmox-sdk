[project]
name = "proxmox-sdk"
version = "0.1.0"
description = "Pythonic SDK for Proxmox VE VM management"
readme = "README.md"
authors = [
    { name = "miciav", email = "5889596+miciav@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "paramiko>=3.0",
    "proxmoxer>=2.0.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "mypy",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proxmox_sdk"]

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 80

[tool.coverage.run]
source = ["src"]

[dependency-groups]
dev = [
    "mypy>=1.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
]
