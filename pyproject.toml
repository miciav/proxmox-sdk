[project]
name = "proxmox-sdk"
version = "0.2.0"
description = "Pythonic SDK for Proxmox VE VM management"
readme = "README.md"
authors = [
    { name = "miciav", email = "5889596+miciav@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "paramiko>=3.0",
    "proxmoxer>=2.0.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "mypy",
    "ruff",
]

[project.scripts]
proxmox-quality = "proxmox_sdk.devtools.quality:main"
proxmox-package-report = "proxmox_sdk.devtools.package_report:main"
proxmox-eval = "proxmox_sdk.devtools.code_eval:main"
proxmox-e2e = "proxmox_sdk.e2e:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proxmox_sdk"]

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["grimp", "paramiko", "proxmoxer"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require real Proxmox server)",
]
addopts = "-m 'not integration'"

[tool.coverage.report]
fail_under = 75

[tool.coverage.run]
source = ["src"]

[dependency-groups]
dev = [
    "grimp>=3.14",
    "import-linter>=2.11",
    "mypy>=1.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
]
